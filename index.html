<!-- save as index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Travel Explorer</title>
  <meta name="description" content="Explore destinations, view photos and check weather" />

  <!-- Basic styling (clean, responsive) -->
  <style>
    :root{
      --bg: #0f1724;
      --card: #0b1220;
      --accent: #06b6d4;
      --muted: #94a3b8;
      --glass: rgba(255,255,255,0.03);
      --radius: 14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%;}
    body{
      margin:0;
      background: linear-gradient(180deg,#071026 0%, #081426 50%, #071228 100%);
      color: #e6eef6;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:24px;
      display:flex;
      flex-direction:column;
      gap:20px;
      align-items:center;
    }

    header{
      width:100%;
      max-width:1100px;
      display:flex;
      gap:16px;
      align-items:center;
      justify-content:space-between;
    }
    .brand{
      display:flex; gap:12px; align-items:center;
    }
    .logo{
      width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,#06b6d4,#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:700;color:#031426;
      box-shadow: 0 6px 20px rgba(7,18,36,0.6);
    }
    h1{margin:0;font-size:20px;letter-spacing:0.2px}
    p.lead{margin:0;color:var(--muted);font-size:13px}

    .controls{
      width:100%;
      max-width:1100px;
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
    }
    .search-bar{
      display:flex;
      gap:8px;
      align-items:center;
      background:var(--glass);
      padding:10px;
      border-radius:12px;
      width:100%;
      box-sizing:border-box;
    }
    .search-bar input{
      flex:1;
      border:0;
      background:transparent;
      color:inherit;
      font-size:16px;
      outline:none;
      padding:6px;
    }
    .btn{
      background:linear-gradient(90deg,var(--accent),#7c3aed);
      border:0;
      padding:10px 14px;
      color:#031426;
      font-weight:600;
      border-radius:10px;
      cursor:pointer;
      box-shadow: 0 6px 18px rgba(12,18,30,0.5);
    }

    main{
      width:100%;
      max-width:1100px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
      gap:16px;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:var(--radius);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:280px;
      position:relative;
      border: 1px solid rgba(255,255,255,0.04);
      transition:transform .18s ease, box-shadow .18s ease;
    }
    .card:hover{ transform: translateY(-6px); box-shadow: 0 14px 40px rgba(3,6,12,0.6); }

    .card-image{
      height:160px;
      background-size:cover;
      background-position:center;
      width:100%;
      flex-shrink:0;
    }
    .card-body{
      padding:12px 14px;
      display:flex;
      flex-direction:column;
      gap:8px;
      flex:1;
    }
    .card h3{ margin:0; font-size:16px; }
    .card p.desc{ margin:0; color:var(--muted); font-size:13px; }
    .info-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:auto; }
    .chip{
      font-size:13px;
      padding:6px 8px;
      background:rgba(255,255,255,0.03);
      border-radius:10px;
      color:var(--muted);
    }
    .small{
      font-size:12px;color:var(--muted);
    }

    /* Modal */
    .modal-backdrop{
      position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:linear-gradient(0deg, rgba(2,6,23,0.6), rgba(2,6,23,0.6)); z-index:60;
    }
    .modal{
      width:95%; max-width:940px; background: linear-gradient(180deg,#071426,#081226); border-radius:18px; overflow:hidden; box-shadow: 0 30px 80px rgba(3,6,12,0.7);
      display:flex; gap:12px; padding:14px; align-items:flex-start;
    }
    .modal-image{ flex:1; min-height:320px; border-radius:10px; background-size:cover; background-position:center; }
    .modal-info{ width:360px; padding:8px 6px; display:flex; flex-direction:column; gap:10px; }
    .close-btn{ background:transparent; border:0; color:var(--muted); font-weight:700; font-size:18px; cursor:pointer; align-self:flex-end; }

    footer{ color:var(--muted); font-size:13px; width:100%; max-width:1100px; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; }

    /* responsive tweaks */
    @media (max-width:700px){
      .modal{ flex-direction:column; padding:12px; }
      .modal-info{ width:100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">TE</div>
      <div>
        <h1>Travel Explorer</h1>
        <p class="lead">Quick destination photos + live weather — plan smarter</p>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <small class="small">Prototype • HTML/CSS/JS</small>
    </div>
  </header>

  <div class="controls">
    <div class="search-bar" role="search" aria-label="Search destinations">
      <input id="searchInput" placeholder="Search a city or destination (e.g., Paris, Kyoto, New York)" aria-label="Search destination" />
      <button id="searchBtn" class="btn" title="Search">Search</button>
    </div>
    <div style="display:flex;gap:8px;">
      <button id="exampleBtn" class="btn" title="Try examples">Try examples</button>
    </div>
  </div>

  <main>
    <section id="status" style="color:var(--muted);font-size:14px"></section>

    <section class="grid" id="resultsGrid" aria-live="polite">
      <!-- cards injected here -->
    </section>

    <div id="noResults" style="display:none;color:var(--muted);text-align:center;padding:24px;border-radius:12px;background:rgba(255,255,255,0.02);">
      No destinations yet — try searching for a city (e.g., "Rome").
    </div>
  </main>

  <!-- Modal for expanded destination -->
  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true" role="dialog">
    <div class="modal" role="document">
      <div style="display:flex;flex-direction:column;gap:8px;flex:1;">
        <button class="close-btn" id="modalClose">✕</button>
        <div id="modalImage" class="modal-image" aria-label="Destination image"></div>
      </div>
      <div class="modal-info">
        <h2 id="modalTitle">Title</h2>
        <p id="modalDesc" class="small"></p>
        <div id="modalWeather" style="margin-top:8px;"></div>
        <div style="margin-top:auto;">
          <small class="small">Images provided by Unsplash • Weather by OpenWeatherMap</small>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div>Made with ❤️ • Travel Explorer</div>
    <div>Unsplash &middot; OpenWeatherMap</div>
  </footer>

  <!-- Script -->
  <script>
  /* === CONFIG: INSERT YOUR KEYS HERE ===
     - Unsplash: create a developer app at https://unsplash.com/developers
     - OpenWeatherMap: create an API key at https://openweathermap.org/api
  */
  const UNSPLASH_KEY = "DFEHn4ZAiaedZCJSdEHc5cOZS9oOaBRA00F7457a7zo";
  const OWM_KEY = "de0babb5730f4b21b2fc8b6150e4b10f";

  // Basic DOM refs
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const resultsGrid = document.getElementById('resultsGrid');
  const statusEl = document.getElementById('status');
  const noResultsEl = document.getElementById('noResults');
  const exampleBtn = document.getElementById('exampleBtn');

  // Modal
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalClose = document.getElementById('modalClose');
  const modalImage = document.getElementById('modalImage');
  const modalTitle = document.getElementById('modalTitle');
  const modalDesc = document.getElementById('modalDesc');
  const modalWeather = document.getElementById('modalWeather');

  // Example suggestions
  const EXAMPLES = ["Paris", "Tokyo", "New York", "Rome", "Bali", "Cape Town", "Sydney"];

  // Utility: create element with classes/text
  function e(tag, cls, txt){ const el = document.createElement(tag); if(cls) el.className = cls; if(txt) el.textContent = txt; return el; }

  // When user clicks Search
  searchBtn.addEventListener('click', () => {
    const query = searchInput.value.trim();
    if(!query) return showStatus("Type a city or destination to search.");
    fetchDestination(query);
  });
  // Enter key
  searchInput.addEventListener('keydown', (ev)=>{
    if(ev.key === 'Enter') searchBtn.click();
  });

  // Try example
  exampleBtn.addEventListener('click', ()=>{
    const pick = EXAMPLES[Math.floor(Math.random()*EXAMPLES.length)];
    searchInput.value = pick;
    searchBtn.click();
  });

  // Show a status message
  function showStatus(msg, isError=false){
    statusEl.textContent = msg;
    statusEl.style.color = isError ? '#ffb4b4' : 'var(--muted)';
    setTimeout(()=> {
      if(statusEl.textContent === msg) statusEl.textContent = '';
    }, 5000);
  }

  async function fetchDestination(query){
    resultsGrid.innerHTML = '';
    noResultsEl.style.display = 'none';
    showStatus(`Searching for "${query}" — fetching images & weather...`);

    try{
      const [photos, weather] = await Promise.all([
        fetchUnsplashPhotos(query),
        fetchWeather(query).catch(err => ({ error: true, message: err.message }))
      ]);

      if(!photos || photos.length === 0){
        noResultsEl.style.display = 'block';
        showStatus(`No photos found for "${query}".`, true);
        return;
      }

      // Build cards from photos; attach weather to each card
      photos.forEach(photo => {
        const card = createCardFromPhoto(photo, weather);
        resultsGrid.appendChild(card);
      });

      showStatus(`Showing ${photos.length} photo(s) for "${query}".`);
    }catch(err){
      console.error(err);
      showStatus("An error occurred. Check API keys and network. See console for details.", true);
    }
  }

  // Fetch images from Unsplash
  async function fetchUnsplashPhotos(query){
    if(!UNSPLASH_KEY || UNSPLASH_KEY === "YOUR_UNSPLASH_ACCESS_KEY"){
      throw new Error("Unsplash API key missing. Put your key in the UNSPLASH_KEY variable.");
    }
    const url = `https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=8&orientation=landscape`;
    const res = await fetch(url, {
      headers: {
        Authorization: `Client-ID ${UNSPLASH_KEY}`,
        'Accept-Version': 'v1'
      }
    });
    if(!res.ok) {
      const txt = await res.text();
      throw new Error('Unsplash error: ' + res.status + ' ' + txt);
    }
    const data = await res.json();
    // Map to simplified objects
    return data.results.map(p => ({
      id: p.id,
      title: (p.description || p.alt_description || queryTitleFromString(p)),
      photographer: p.user && p.user.name ? p.user.name : 'Unsplash',
      thumb: p.urls.small,
      full: p.urls.regular,
      link: p.links.html
    }));
  }

  // Fallback title generator if Unsplash photo lacks description
  function queryTitleFromString(p){
    return (p.alt_description || 'Beautiful destination');
  }

  // Fetch weather from OpenWeatherMap
  async function fetchWeather(query){
    if(!OWM_KEY || OWM_KEY === "YOUR_OPENWEATHER_KEY"){
      // Return friendly message object instead of throwing to still show images
      return { error: true, message: "OpenWeatherMap API key missing. Put your key in the OWM_KEY variable." };
    }
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(query)}&appid=${OWM_KEY}&units=metric`;
    const res = await fetch(url);
    if(!res.ok){
      const txt = await res.text();
      // Provide info object so images still show
      return { error: true, message: `Weather not available: ${res.status}` };
    }
    const w = await res.json();
    // condense
    return {
      name: w.name,
      country: w.sys && w.sys.country,
      temp: Math.round(w.main.temp),
      feels_like: Math.round(w.main.feels_like),
      description: w.weather && w.weather[0] && w.weather[0].description,
      icon: w.weather && w.weather[0] && w.weather[0].icon,
      wind: Math.round(w.wind && w.wind.speed)
    };
  }

  // Create a card element using photo and weather
  function createCardFromPhoto(photo, weather){
    const card = e('article','card');
    const imgDiv = e('div','card-image');
    imgDiv.style.backgroundImage = `url('${photo.thumb}')`;
    imgDiv.setAttribute('role','img');
    imgDiv.setAttribute('aria-label', photo.title || 'Destination photo');

    const body = e('div','card-body');
    const title = e('h3',null, photo.title || 'Destination');
    const desc = e('p','desc', `Photo by ${photo.photographer}`);
    const infoRow = e('div','info-row');
    const weatherChip = e('div','chip', weather && !weather.error ? `${weather.temp}°C • ${capitalize(weather.description||'')}` : 'Weather: N/A');
    const viewBtn = e('button','btn', 'View');
    viewBtn.style.padding = '7px 10px';
    viewBtn.addEventListener('click', ()=> openModal(photo, weather));

    infoRow.appendChild(weatherChip);
    infoRow.appendChild(viewBtn);

    body.appendChild(title);
    body.appendChild(desc);
    body.appendChild(infoRow);

    card.appendChild(imgDiv);
    card.appendChild(body);

    // click image or title to open modal as well
    imgDiv.addEventListener('click', ()=> openModal(photo, weather));
    title.addEventListener('click', ()=> openModal(photo, weather));

    return card;
  }

  function capitalize(s){
    if(!s) return '';
    return s.split(' ').map(w=>w[0]?.toUpperCase()+w.slice(1)).join(' ');
  }

  // Modal open
  function openModal(photo, weather){
    modalBackdrop.style.display = 'flex';
    modalBackdrop.setAttribute('aria-hidden','false');
    modalImage.style.backgroundImage = `url('${photo.full}')`;
    modalTitle.textContent = photo.title || 'Destination';
    modalDesc.textContent = `Photo by ${photo.photographer}. View on Unsplash.`;
    if(weather && !weather.error){
      modalWeather.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:6px;">
          <div style="font-weight:700;font-size:18px">${weather.temp}°C ${weather.description ? '• ' + capitalize(weather.description) : ''}</div>
          <div class="small">Feels like ${weather.feels_like}°C • Wind ${weather.wind} m/s</div>
          <div class="small">Location: ${weather.name}${weather.country ? ', ' + weather.country : ''}</div>
        </div>
      `;
    } else {
      modalWeather.innerHTML = `<div class="small" style="color:var(--muted)">${weather && weather.message ? weather.message : 'Weather data not available.'}</div>`;
    }
  }

  // Close modal
  modalClose.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', (e)=> {
    if(e.target === modalBackdrop) closeModal();
  });
  function closeModal(){
    modalBackdrop.style.display = 'none';
    modalBackdrop.setAttribute('aria-hidden','true');
  }

  // Accessibility: trap Escape
  document.addEventListener('keydown', (ev)=>{
    if(ev.key === 'Escape') closeModal();
  });

  // On load: show a few suggested cards
  (function loadDefaults(){
    // show a few example tiles so page isn't empty
    EXAMPLES.slice(0,4).forEach(async (sample)=>{
      try{
        const photos = await fetchUnsplashPhotos(sample);
        const weather = await fetchWeather(sample).catch(()=>({error:true}));
        if(photos && photos.length){
          const card = createCardFromPhoto(photos[0], weather);
          resultsGrid.appendChild(card);
        }
      }catch(e){ /* ignore missing keys at startup */ }
    });
    noResultsEl.style.display = resultsGrid.children.length ? 'none' : 'block';
  })();
  </script>
</body>
</html>
